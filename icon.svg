<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#042f2e" />
    </linearGradient>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#14b8a6" />
      <stop offset="100%" stop-color="#0d9488" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Base with subtle border -->
  <rect width="512" height="512" rx="115" fill="url(#bgGrad)" />
  <rect x="6" y="6" width="500" height="500" rx="110" fill="none" stroke="url(#primaryGrad)" stroke-width="4" stroke-opacity="0.35" />

  <!-- Outer Tech Hexagon / Circle Glow -->
  <circle cx="256" cy="240" r="165" fill="#0d9488" fill-opacity="0.12" filter="url(#glow)" />
  <circle cx="256" cy="240" r="150" fill="none" stroke="#14b8a6" stroke-width="3" stroke-dasharray="14 10" stroke-opacity="0.4" />

  <!-- Stylized Smartphone Silhouette -->
  <rect x="166" y="100" width="180" height="295" rx="36" fill="#1e293b" stroke="#38bdf8" stroke-width="6" />
  
  <!-- Screen Area -->
  <rect x="180" y="135" width="152" height="215" rx="16" fill="#090d16" />

  <!-- Speaker & Front Camera -->
  <rect x="236" y="116" width="40" height="6" rx="3" fill="#64748b" />
  <circle cx="290" cy="119" r="3.5" fill="#38bdf8" />

  <!-- Inside Screen: Repair Gear & Lightning Wrench Symbol -->
  <!-- Circuit Grid Lines -->
  <path d="M 195 240 L 225 240 L 240 220" fill="none" stroke="#14b8a6" stroke-width="3" stroke-linecap="round" stroke-opacity="0.6"/>
  <path d="M 317 240 L 287 240 L 272 260" fill="none" stroke="#14b8a6" stroke-width="3" stroke-linecap="round" stroke-opacity="0.6"/>
  
  <!-- Screwdriver & Wrench Crossed in Center -->
  <!-- Wrench -->
  <g transform="translate(256, 235) rotate(-35) translate(-256, -235)">
    <path d="M246 165 C236 168 230 178 232 188 C233 194 237 199 242 202 L242 285 C242 292 248 298 256 298 C264 298 270 292 270 285 L270 202 C275 199 279 194 280 188 C282 178 276 168 266 165 L266 178 L246 178 Z" fill="url(#primaryGrad)" />
    <circle cx="256" cy="275" r="4.5" fill="#0f172a" />
  </g>

  <!-- High-Power Golden Lightning Bolt -->
  <path d="M264 165 L234 230 L256 230 L244 285 L284 218 L260 218 Z" fill="url(#goldGrad)" filter="url(#glow)" />

  <!-- Home Indicator Bar -->
  <rect x="226" y="372" width="60" height="5" rx="2.5" fill="#94a3b8" />

  <!-- Bottom Brand Text -->
  <text x="256" y="445" font-family="'Tajawal', 'Segoe UI', sans-serif" font-size="34" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="3">MOBIFIX</text>
  <text x="256" y="475" font-family="'Tajawal', 'Segoe UI', sans-serif" font-size="16" font-weight="700" fill="#2dd4bf" text-anchor="middle" letter-spacing="6">PRO SYSTEM</text>
</svg>
